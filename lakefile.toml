name = "paralever"
version = "1.34.0"
# `Lang` is listed so a plain `lake build` covers the file front end too, which the exe root alone
# would not reach.
defaultTargets = ["paralever", "Lang", "Tool"]

# Diagnostics: positions, spans, codes and the rendered report. Below both front ends, because
# both report through it and neither may depend on the other. Imports nothing but core Lean, so a
# reader stays checkable on its own. See docs/diagnostics.md.
[[lean_lib]]
name = "Diag"

[[lean_lib]]
name = "Paralever"

[[lean_lib]]
name = "Examples"
globs = ["Examples.+"]

[[lean_lib]]
name = "Test"
globs = ["Test.+"]

# The evaluation harness. `Bench.Verdict` imports nothing and is called *by* `MLIR.Corpus`, so the
# scoring of the pilots and of every suite added later is one piece of code; the layers above it
# read files through `Tool.Run.loadAny` and reimplement no measurement. A separate lib because it
# is the only part of the tree that times anything, and timing never runs during `lake build`.
# See docs/bench.md.
[[lean_lib]]
name = "Bench"
globs = ["Bench.+"]

# The MLIR front end: a reader for MLIR generic form and the lowering into `ParProg`.
# A separate lib because it is the only part of the tree that parses text, and because
# `MLIR.Lower` is the object the footprint-preservation theorem will be about.
# See docs/mlir.md.
[[lean_lib]]
name = "MLIR"
globs = ["MLIR.+"]

# The ParProg language and its `.prl` file front end. A separate lib for the reason MLIR is one:
# it parses text, and `Lang.Compile.Lower` is the step a file is believed through. See docs/prl.md.
[[lean_lib]]
name = "Lang"
globs = ["Lang.+"]

# The `paralever` command line. A separate lib so the executable's root stays one line, and
# because this is the only part of the tree that reads argv and writes files. Not named `Cli`:
# that is a package Mathlib depends on, and two libs of one name cannot share a `LEAN_PATH`.
# See docs/cli.md.
[[lean_lib]]
name = "Tool"
globs = ["Tool", "Tool.+"]

[[lean_exe]]
name = "paralever"
root = "Main"

# The harness, as a binary. Not in `defaultTargets`: `lake build` must not time anything, and a
# machine with no corpus on disk must still build green. See docs/bench.md.
[[lean_exe]]
name = "paralever-bench"
root = "Bench.Main"

# A scratch module for `web/build-snippets.sh`: it writes the file `paralever prove`
# generates here so Lake can build its `:highlighted` facet, which is what
# verso-snippets renders. Not checked in — see .gitignore.
[[lean_lib]]
name = "Snippet"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.0"

[[require]]
name = "verso-slides"
scope = "leanprover"
rev = "v4.34.0"

# The deck itself, as a library so `import Slides` resolves from SlidesMain.
# Without this, Lake builds SlidesMain but never builds Slides, and the import fails.
[[lean_lib]]
name = "Slides"
srcDir = "docs/slides"
# `leanLibCode` blocks read the highlighted source of Paralever declarations, so
# Lake must build that facet before elaborating the deck. Named per module, not
# `@paralever:highlighted` — Slides is itself a lib in this package, so the
# whole-package form makes Slides depend on its own highlighted facet (build cycle).
needs = [
  "@paralever/+Paralever.Core.ParM:highlighted",
  "@paralever/+Paralever.Core.Semantics:highlighted",
  "@paralever/+Paralever.Core.Access:highlighted",
  "@paralever/+Paralever.Theory.Sequentialize:highlighted",
  "@paralever/+Paralever.Theory.WellFormedCanonical:highlighted",
  "@paralever/+Paralever.Lib.Block:highlighted",
  "@paralever/+Examples.Programs.SumArray:highlighted",
  "@paralever/+Examples.Programs.CompareSwap:highlighted",
  "@paralever/+Examples.Programs.MatMul:highlighted",
  "@paralever/+Lang.Core.Prog:highlighted",
  "@paralever/+Lang.Core.Analysis:highlighted",
  "@paralever/+Paralever.AutoPar.Plan:highlighted",
  "@paralever/+Paralever.AutoPar.Dag:highlighted",
  "@paralever/+Paralever.AutoPar.Sound:highlighted",
  "@paralever/+Paralever.AutoPar.Rewrite:highlighted",
]

[[lean_exe]]
name = "slides"
srcDir = "docs/slides"
root = "SlidesMain"
supportInterpreter = true
