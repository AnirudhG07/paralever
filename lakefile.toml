name = "paralever"
version = "0.1.0"
defaultTargets = ["paralever"]

[[lean_lib]]
name = "Paralever"

[[lean_lib]]
name = "Examples"
globs = ["Examples.+"]

[[lean_lib]]
name = "Test"
globs = ["Test.+"]

[[lean_exe]]
name = "paralever"
root = "Main"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.0"

# iris-lean: we use only the BI interface, the proof mode, and the heap algebra.
# The package root is the `Iris` subdirectory of the repo.
# See the plan: we deliberately do NOT depend on Iris/ProgramLogic or Iris/HeapLang.
[[require]]
name = "iris"
git = "https://github.com/leanprover-community/iris-lean"
subDir = "Iris"
rev = "v4.34.0"

[[require]]
name = "verso-slides"
scope = "leanprover"
rev = "v4.34.0"

# The deck itself, as a library so `import Slides` resolves from SlidesMain.
# Without this, Lake builds SlidesMain but never builds Slides, and the import fails.
[[lean_lib]]
name = "Slides"
srcDir = "docs/slides"

[[lean_exe]]
name = "slides"
srcDir = "docs/slides"
root = "SlidesMain"
supportInterpreter = true
